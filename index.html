<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>اختبار قواعد اللغة الإنجليزية</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 15px;
        }
        .container {
            background-color: #1e293b;
            border-radius: 16px;
            padding: 24px;
            width: 100%;
            max-width: 500px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
            text-align: center;
        }
        h1 {
            color: #38bdf8;
            font-size: 1.5rem;
            margin-bottom: 20px;
        }
        .subtitle {
            color: #94a3b8;
            margin-bottom: 15px;
            font-size: 0.95rem;
        }
        .btn {
            background-color: #3b82f6;
            color: white;
            border: none;
            padding: 14px;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: bold;
            width: 100%;
            margin-bottom: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .btn:active {
            transform: scale(0.98);
        }
        .btn-purple { background-color: #8b5cf6; }
        .btn-green { background-color: #22c55e; }
        .btn-orange { background-color: #f59e0b; }
        .btn-red { background-color: #ef4444; }
        
        .quiz-box, .result-box { display: none; }
        .option-btn {
            background-color: #334155;
            color: #f8fafc;
            border: 2px solid #475569;
            text-align: left;
            direction: ltr;
        }
        .correct { background-color: #15803d !important; border-color: #22c55e !important; }
        .wrong { background-color: #b91c1c !important; border-color: #ef4444 !important; }
        
        .progress-bar {
            height: 8px;
            background-color: #334155;
            border-radius: 4px;
            margin-bottom: 20px;
            overflow: hidden;
        }
        .progress {
            height: 100%;
            background-color: #38bdf8;
            width: 0%;
            transition: width 0.3s;
        }
    </style>
</head>
<body>

<div class="container">
    <div id="home-screen">
        <h1>اختبار قواعد اللغة الإنجليزية</h1>
        <p class="subtitle">اختر نظام الاختبار:</p>
        <button class="btn" onclick="startQuiz('quick')">كويز سريع (10 أسئلة)</button>
        <button class="btn btn-purple" onclick="startQuiz('full')">امتحان شامل (جميع الأسئلة)</button>
        
        <p class="subtitle" style="margin-top: 20px;">أو اختر حسب المستوى:</p>
        <button class="btn btn-green" onclick="startQuiz('easy')">سهل (Easy Level)</button>
        <button class="btn btn-orange" onclick="startQuiz('medium')">متوسط (Medium Level)</button>
        <button class="btn btn-red" onclick="startQuiz('hard')">صعب (Hard Level)</button>
    </div>

    <div id="quiz-screen" class="quiz-box">
        <div class="progress-bar"><div id="progress" class="progress"></div></div>
        <p id="question-text" style="direction: ltr; text-align: left; font-size: 1.1rem; margin-bottom: 20px;"></p>
        <div id="options-container"></div>
    </div>

    <div id="result-screen" class="result-box">
        <h2>النتيجة النهائية</h2>
        <p id="score-text" style="font-size: 1.5rem; margin: 20px 0; color: #38bdf8;"></p>
        <button class="btn" onclick="location.reload()">العودة للرئيسية</button>
    </div>
</div>

<script>
const questions = [
    { q: "She ___ to the store yesterday.", options: ["go", "went", "gone", "going"], answer: 1, level: "easy" },
    { q: "They ___ playing football now.", options: ["is", "are", "am", "be"], answer: 1, level: "easy" },
    { q: "If I ___ rich, I would buy a boat.", options: ["am", "was", "were", "been"], answer: 2, level: "medium" },
    { q: "He has been living here ___ 2010.", options: ["for", "since", "from", "in"], answer: 1, level: "medium" },
    { q: "Hardly ___ entered the room when the phone rang.", options: ["had I", "I had", "did I", "I did"], answer: 0, level: "hard" }
];

let currentQuestions = [];
let currentIndex = 0;
let score = 0;

function startQuiz(type) {
    if (type === 'quick') {
        currentQuestions = [...questions].sort(() => 0.5 - Math.random()).slice(0, 10);
    } else if (type === 'full') {
        currentQuestions = [...questions];
    } else {
        currentQuestions = questions.filter(q => q.level === type);
    }

    if (currentQuestions.length === 0) {
        alert('لا توجد أسئلة متوفرة لهذا القسم حالياً');
        return;
    }

    document.getElementById('home-screen').style.display = 'none';
    document.getElementById('quiz-screen').style.display = 'block';
    showQuestion();
}

function showQuestion() {
    const q = currentQuestions[currentIndex];
    document.getElementById('question-text').innerText = `${currentIndex + 1}. ${q.q}`;
    const optionsContainer = document.getElementById('options-container');
    optionsContainer.innerHTML = '';

    document.getElementById('progress').style.width = `${((currentIndex) / currentQuestions.length) * 100}%`;

    q.options.forEach((opt, idx) => {
        const btn = document.createElement('button');
        btn.className = 'btn option-btn';
        btn.innerText = opt;
        btn.onclick = () => selectOption(idx, q.answer, btn);
        optionsContainer.appendChild(btn);
    });
}

function selectOption(selected, correct, btn) {
    const btns = document.querySelectorAll('.option-btn');
    btns.forEach(b => b.disabled = true);

    if (selected === correct) {
        btn.classList.add('correct');
        score++;
    } else {
        btn.classList.add('wrong');
        btns[correct].classList.add('correct');
    }

    setTimeout(() => {
        currentIndex++;
        if (currentIndex < currentQuestions.length) {
            showQuestion();
        } else {
            showResults();
        }
    }, 1000);
}

function showResults() {
    document.getElementById('quiz-screen').style.display = 'none';
    document.getElementById('result-screen').style.display = 'block';
    document.getElementById('score-text').innerText = `${score} / ${currentQuestions.length}`;
}
</script>

</body>
</html>
