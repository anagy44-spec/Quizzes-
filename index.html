<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>تطبيق اختبارات الإنجليزي - المعاصر</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 15px;
        }
        .container {
            background-color: #1e293b;
            border-radius: 16px;
            padding: 20px;
            width: 100%;
            max-width: 500px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
            text-align: center;
        }
        h1 {
            color: #38bdf8;
            font-size: 1.4rem;
            margin-bottom: 15px;
        }
        h2 {
            color: #f1f5f9;
            font-size: 1.2rem;
            margin-bottom: 15px;
        }
        .subtitle {
            color: #94a3b8;
            margin-bottom: 12px;
            font-size: 0.9rem;
        }
        .btn {
            background-color: #3b82f6;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 10px;
            font-size: 0.95rem;
            font-weight: bold;
            width: 100%;
            margin-bottom: 10px;
            cursor: pointer;
            transition: all 0.2s ease;
            display: block;
        }
        .btn:active {
            transform: scale(0.98);
        }
        .btn-stage { background-color: #1e293b; border: 2px solid #38bdf8; color: #38bdf8; }
        .btn-grade { background-color: #334155; color: #f8fafc; border: 1px solid #475569; }
        .btn-unit { background-color: #0284c7; }
        .btn-purple { background-color: #8b5cf6; }
        .btn-back { background-color: #64748b; margin-top: 10px; }
        
        .screen { display: none; }
        .active { display: block; }

        .option-btn {
            background-color: #334155;
            color: #f8fafc;
            border: 2px solid #475569;
            text-align: left;
            direction: ltr;
        }
        .correct { background-color: #15803d !important; border-color: #22c55e !important; }
        .wrong { background-color: #b91c1c !important; border-color: #ef4444 !important; }
        
        .progress-bar {
            height: 8px;
            background-color: #334155;
            border-radius: 4px;
            margin-bottom: 20px;
            overflow: hidden;
        }
        .progress {
            height: 100%;
            background-color: #38bdf8;
            width: 0%;
            transition: width 0.3s;
        }
    </style>
</head>
<body>

<div class="container">
    
    <!-- 1. الشاشة الرئيسية: اختيار المرحلة -->
    <div id="stage-screen" class="screen active">
        <h1>اختبارات اللغة الإنجليزية</h1>
        <p class="subtitle">تمارين وامتحانات كتاب المعاصر</p>
        <button class="btn btn-stage" onclick="showGrades('primary')">المرحلة الابتدائية (1-6)</button>
        <button class="btn btn-stage" onclick="showGrades('prep')">المرحلة الإعدادية (1-3)</button>
        <button class="btn btn-stage" onclick="showGrades('sec')">المرحلة الثانوية (1-3)</button>
    </div>

    <!-- 2. شاشة اختيار الصف الدراسي -->
    <div id="grade-screen" class="screen">
        <h2 id="stage-title">اختر الصف الدراسي</h2>
        <div id="grades-container"></div>
        <button class="btn btn-back" onclick="navTo('stage-screen')">رجوع للمراحل</button>
    </div>

    <!-- 3. شاشة اختيار الوحدات / الامتحان -->
    <div id="unit-screen" class="screen">
        <h2 id="grade-title">امتحانات الصف</h2>
        <p class="subtitle">اختر الوحده أو نوع الامتحان:</p>
        <div id="units-container"></div>
        <button class="btn btn-back" onclick="navTo('grade-screen')">رجوع للصفوف</button>
    </div>

    <!-- 4. شاشة الأسئلة -->
    <div id="quiz-screen" class="screen">
        <div class="progress-bar"><div id="progress" class="progress"></div></div>
        <p id="question-text" style="direction: ltr; text-align: left; font-size: 1.1rem; margin-bottom: 20px;"></p>
        <div id="options-container"></div>
    </div>

    <!-- 5. شاشة النتيجة -->
    <div id="result-screen" class="screen">
        <h2>النتيجة النهائية</h2>
        <p id="score-text" style="font-size: 1.5rem; margin: 20px 0; color: #38bdf8;"></p>
        <button class="btn" onclick="navTo('stage-screen')">العودة للقائمة الرئيسية</button>
    </div>

</div>

<script>
// قائمة الصفوف حسب المراحل
const stages = {
    primary: [
        { id: "p1", name: "الصف الأول الابتدائي" },
        { id: "p2", name: "الصف الثاني الابتدائي" },
        { id: "p3", name: "الصف الثالث الابتدائي" },
        { id: "p4", name: "الصف الرابع الابتدائي" },
        { id: "p5", name: "الصف الخامس الابتدائي" },
        { id: "p6", name: "الصف السادس الابتدائي" }
    ],
    prep: [
        { id: "prep1", name: "الصف الأول الإعدادي" },
        { id: "prep2", name: "الصف الثاني الإعدادي" },
        { id: "prep3", name: "الصف الثالث الإعدادي" }
    ],
    sec: [
        { id: "sec1", name: "الصف الأول الثانوي" },
        { id: "sec2", name: "الصف الثاني الثانوي" },
        { id: "sec3", name: "الصف الثالث الثانوي" }
    ]
};

// بنك الأسئلة مقسم حسب الصف والوحدة (نموذج قابل للتوسع لجميع الدروس)
const examBank = {
    // مثال لأسئلة أولى إعدادي
    "prep1": {
        "unit1": [
            { q: "My sister and I have the same parents. She is my ___.", options: ["brother", "sister", "aunt", "uncle"], answer: 1 },
            { q: "They go to the club ___ Fridays.", options: ["in", "on", "at", "for"], answer: 1 }
        ],
        "unit2": [
            { q: "Computer Studies is my favorite ___.", options: ["sport", "subject", "color", "food"], answer: 1 }
        ],
        "full": [
            { q: "My sister and I have the same parents. She is my ___.", options: ["brother", "sister", "aunt", "uncle"], answer: 1 },
            { q: "Computer Studies is my favorite ___.", options: ["sport", "subject", "color", "food"], answer: 1 }
        ]
    },
    // مثال لأسئلة ثالثة ثانوي
    "sec3": {
        "unit1": [
            { q: "The crime line was blocked because the police ___ the evidence.", options: ["were examining", "had examined", "examine", "examines"], answer: 0 }
        ],
        "full": [
            { q: "The crime line was blocked because the police ___ the evidence.", options: ["were examining", "had examined", "examine", "examines"], answer: 0 }
        ]
    }
};

let currentGrade = "";
let currentQuestions = [];
let currentIndex = 0;
let score = 0;

function navTo(screenId) {
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    document.getElementById(screenId).classList.add('active');
}

function showGrades(stageKey) {
    const container = document.getElementById('grades-container');
    container.innerHTML = '';
    
    stages[stageKey].forEach(grade => {
        const btn = document.createElement('button');
        btn.className = 'btn btn-grade';
        btn.innerText = grade.name;
        btn.onclick = () => showUnits(grade.id, grade.name);
        container.appendChild(btn);
    });
    
    navTo('grade-screen');
}

function showUnits(gradeId, gradeName) {
    currentGrade = gradeId;
    document.getElementById('grade-title').innerText = gradeName;
    const container = document.getElementById('units-container');
    container.innerHTML = '';

    // إنشاء أزرار 6 وحدات لجميع الصفوف + امتحان شامل المعاصر
    for (let i = 1; i <= 6; i++) {
        const btn = document.createElement('button');
        btn.className = 'btn btn-unit';
        btn.innerText = `اختبار Unit ${i}`;
        btn.onclick = () => startQuiz(`unit${i}`);
        container.appendChild(btn);
    }

    const fullBtn = document.createElement('button');
    fullBtn.className = 'btn btn-purple';
    fullBtn.innerText = "امتحان شامل (كتاب المعاصر)";
    fullBtn.onclick = () => startQuiz('full');
    container.appendChild(fullBtn);

    navTo('unit-screen');
}

function startQuiz(unitKey) {
    if (examBank[currentGrade] && examBank[currentGrade][unitKey]) {
        currentQuestions = examBank[currentGrade][unitKey];
    } else {
        // أسئلة افتراضية في حال عدم إدخال أسئلة الصفحة المحددة بعد
        currentQuestions = [
            { q: "Choose the correct sentence (Sample Question):", options: ["He go to school", "He goes to school", "He going to school", "He gone to school"], answer: 1 },
            { q: "She ___ English every day.", options: ["study", "studies", "studying", "studied"], answer: 1 }
        ];
    }

    currentIndex = 0;
    score = 0;
    navTo('quiz-screen');
    showQuestion();
}

function showQuestion() {
    const q = currentQuestions[currentIndex];
    document.getElementById('question-text').innerText = `${currentIndex + 1}. ${q.q}`;
    const optionsContainer = document.getElementById('options-container');
    optionsContainer.innerHTML = '';

    document.getElementById('progress').style.width = `${((currentIndex) / currentQuestions.length) * 100}%`;

    q.options.forEach((opt, idx) => {
        const btn = document.createElement('button');
        btn.className = 'btn option-btn';
        btn.innerText = opt;
        btn.onclick = () => selectOption(idx, q.answer, btn);
        optionsContainer.appendChild(btn);
    });
}

function selectOption(selected, correct, btn) {
    const btns = document.querySelectorAll('.option-btn');
    btns.forEach(b => b.disabled = true);

    if (selected === correct) {
        btn.classList.add('correct');
        score++;
    } else {
        btn.classList.add('wrong');
        btns[correct].classList.add('correct');
    }

    setTimeout(() => {
        currentIndex++;
        if (currentIndex < currentQuestions.length) {
            showQuestion();
        } else {
            showResults();
        }
    }, 1000);
}

function showResults() {
    document.getElementById('score-text').innerText = `${score} / ${currentQuestions.length}`;
    navTo('result-screen');
}
</script>

</body>
</html>
